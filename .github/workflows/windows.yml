name: Windows EXE
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name CopyJob --version-file version_info.txt --add-data "wmi_setup.ps1;." app.py
      - uses: actions/upload-artifact@v4
        with:
          name: CopyJob-1.1.0-windows-x64
          path: dist/CopyJob.exe
